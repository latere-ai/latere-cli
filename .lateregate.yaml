# The per-push gate configuration for latere-cli. Every check runs from
# latere.ai/x/ci-gate, pinned in go.mod, so a gate that fails on a runner
# fails the same way on a laptop.

hermetic:
  # One directory, for one binary. The local agent's tests run commands
  # through the host machine's shell, /bin/sh on both a laptop and a runner;
  # with allow: [] they fail rather than skip, so the entry is measured
  # rather than assumed. Nothing else is on PATH: the upgrade path is tested against a
  # synthesised archive rather than by running one, and every network test
  # talks to an httptest server.
  allow: [/bin]

spec:
  # `complete` and `implemented` record a surface that shipped and mean the
  # same thing to a reader, so both stay until the tree is reconciled.
  # `in-progress` is a surface designed and not yet shipped, and `archived` is
  # the terminal status. Nothing else is allowed in.
  status: [in-progress, complete, implemented, archived]
  # No index rule: specs/README.md describes the tree in prose and a fenced
  # listing rather than a table, so there is no status cell for a spec to
  # disagree with. It is excluded because it is not itself a spec.
  exclude: [README.md]
  # The specs use Markdown tables for their command surfaces, and a row whose
  # cell count drifts renders as silently missing columns.
  tables: true
  archive:
    dir: .archive
    statuses: [archived]

license:
  # The identifier every source file carries and the holder it names. There
  # is no default: this is the decision the gate checks the tree against.
  # `go tool lateregate license -w` writes the notice where it is missing.
  spdx: MIT
  holder: Latere AI
  extensions: ['.go']
  names: [Makefile]

# Gates this repository does not run yet. Each entry is temporary by
# construction: after the date the gate runs and fails on its own terms.
waive:
  cover:
    reason: >-
      the tree is at 66.1% against a 90% per-package floor; the command layer drives a terminal UI that the suite does not exercise yet
    until: 2026-12-01

# The identity shape of the family: specs/infrastructure/identity.md in latere-ai/specs
identity:
  role: client
  audiences: [cella, origo, api.latere.ai, insula, examen]
  roles_only: true
  waive:
    client-audiences:
      reason: >-
        the manifest's apiVersion cella.latere.ai, which the `latere environments` help prints, shares its word with the audience cella, and the rule matches the word in every string literal, so each file with that help text reads as a second minter; the audience is presented from internal/commands/cella.go alone. The waiver also pauses the rule for origo and api.latere.ai until it ends; api.latere.ai is also the host of the Environments and models URLs, so every literal naming those URLs reads as a mint of it, while the audience is the SDK's latere.DefaultAudience, which no literal here names
      until: 2026-12-01

platform_via_sdk:
  enabled: true
  allow:
    /v1/environments: the Environments capability's Go client is Cella's open-core client, latere.ai/x/cella/client, which the CLI and the device engine share
