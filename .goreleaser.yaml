version: 2

project_name: latere

before:
  hooks:
    - go mod tidy

builds:
  - id: latere
    main: ./cmd/latere
    binary: latere
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "latere_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# No changelog block: the release body is the tag's CHANGELOG.md section,
# passed by the pipeline as --release-notes.

release:
  github:
    owner: latere-ai
    name: latere-cli
