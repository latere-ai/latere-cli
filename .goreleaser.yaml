version: 2

project_name: latere

before:
  hooks:
    - go mod tidy

builds:
  - id: latere
    main: ./cmd/latere
    binary: latere
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

# The installer platform.latere.ai serves (latere-ai/platform, spec 186) downloads
# an archive by this name and checksums.txt beside it, as `latere upgrade`
# does, and each verifies one of the signatures under `signs` below. A
# release that renames any of these files breaks every install.
archives:
  - id: default
    name_template: "latere_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# checksums.txt names every archive's SHA-256, so signing it covers them all.
# tools/sign signs it twice with the key in RELEASE_SIGNING_KEY, which the
# release workflow passes from the repository's secret, each entry writing
# the one file GoReleaser uploads for it:
#
# - checksums.txt.sig, the base64 of its Ed25519 signature, which `latere
#   upgrade` and auto-upgrade verify against internal/upgrade/keys.go before
#   they read any checksum;
# - checksums.txt.sshsig, the same key's SSH signature with the namespace
#   latere-release, which the installer verifies with `ssh-keygen -Y verify`
#   against the allowed signers line in keys.go.
#
# The signer fails, and the release with it, when the key is unset or
# keys.go does not hold its public half, so a release is never published
# unsigned.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"
  - id: checksums-ssh
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/sign", "-sshsig", "${artifact}", "${signature}"]
    signature: "${artifact}.sshsig"

# No changelog block: the release body is the tag's CHANGELOG.md section,
# passed by the pipeline as --release-notes.

release:
  github:
    owner: latere-ai
    name: latere-cli
