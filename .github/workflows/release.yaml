name: release

# Tag-triggered CLI release via the central reusable pipeline (latere-ai/ci),
# driven by this repo's .goreleaser.yaml. lint/test run in ci.yaml on main/PR,
# so the release stage is goreleaser-only here.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/cli-release.yml@v1
    with:
      run_lint: false
      run_tests: false
    secrets: inherit
